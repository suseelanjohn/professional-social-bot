name: Build Professional Social Bot APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Lets you trigger a build anytime with 1 click

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17 for Android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Install Gradle 8.9 (No Wrapper Needed)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 4. Compile Debug APK
        run: gradle assembleDebug --stacktrace

      - name: 5. Upload Installable APK (Direct Un-Zipped Download)
        uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/apk/debug/app-debug.apk
          archive: false
