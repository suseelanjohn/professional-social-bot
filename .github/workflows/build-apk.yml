name: Build Professional Social Bot APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17 for Android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 4. Compile Debug APK using Gradle Build Action
        uses: gradle/actions/setup-gradle@v4
        with:
          arguments: assembleDebug
